<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Discover your daily Monogatari character.">
    <meta property="og:title" content="Monogatari Character of the Day">
    <meta property="og:description" content="Find your daily Monogatari character!">
    <meta name="theme-color" content="#2b2f4a">
    <link rel="stylesheet" href="monogataristyle.css">
    <link rel="icon" href="img/monoicon.jpg" type="image/png">
    <title>Your TypeMoon Character of the Day</title>
</head>
<body>
<header>
    <a href="index.html" class="backBtn">Back</a>
    <h1>Your Monogatari character of the day!</h1>
    <button id="collectionBtn">Check Collection</button>
</header>
<main>
    <h2>Your character is:</h2>
    <section class="character">
        <div class="frame">
            <img id="picture" src="img/unknown.jpg" alt="unknown">
        </div>
        <p id="name">Roll!</p>
    </section>
    <section id="roll">
        <p>Roll for your character!</p>
        <button id="rollBtn">roll</button>
    </section>
</main>
<aside id="collectionPanel"></aside>
<footer>
    <p>Author: <a href="https://x.com/ReisRyougi">Reis Ryougi</a></p>
</footer>
<script src="monogatariscript.js"></script>

</html>
